<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фототаблиця Огляду Останків</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
</head>
<body>
<header class="appbar">
  <!-- Вбудований векторний логотип -->
  <svg class="logo-svg" viewBox="0 0 100 100" width="36" height="36">
    <circle cx="50" cy="50" r="48" fill="#fff" stroke="#1f4e79" stroke-width="4"/>
    <path d="M50 15 L55 35 L75 35 L60 48 L65 68 L50 55 L35 68 L40 48 L25 35 L45 35 Z" fill="#ffd700" stroke="#1f4e79" stroke-width="2"/>
    <rect x="35" y="55" width="30" height="25" rx="3" fill="#1f4e79"/>
    <text x="50" y="72" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">DNA</text>
  </svg>
  <h1>Огляд останків</h1>
  <button id="btnNew" class="icon-btn" aria-label="Нова таблиця">🔄</button>
</header>

<main>
  <section>
    <label class="field"><span>№ Тіла (Обов'язково)</span>
      <input type="text" id="bodyNumber" placeholder="Напр. 20260916010004067">
    </label>
    <label class="field"><span>Місце дослідження</span>
      <input type="text" id="place" placeholder="ДСУ «Одеське ОБ СМЕ»...">
    </label>
    <div class="row-2">
      <label class="field"><span>Дата дослідження</span><input type="date" id="date"></label>
      <label class="field"><span>Спеціаліст №1 (ПІБ)</span><input type="text" id="spec1"></label>
    </div>
    <label class="field"><span>Спеціаліст №2 (ПІБ)</span><input type="text" id="spec2"></label>
  </section>

  <section>
    <h2>Фотографії (<span id="count">0</span>)</h2>
    <div class="btn-row">
      <button id="btnCamera" class="btn primary">📷 Камера</button>
      <button id="btnGallery" class="btn outline">🖼️ Галерея</button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galInput" accept="image/*" multiple hidden>
    <div id="photoList"></div>
  </section>
</main>

<div class="bottombar">
  <button id="btnFinish" class="btn primary" disabled>💾 Згенерувати Фототаблицю</button>
</div>

<!-- Модальне вікно результатів -->
<div id="modal" class="overlay" hidden>
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<script src="docx.js"></script>
<script src="app.js"></script>
</body>
</html>
