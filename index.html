<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фототаблиця Огляду Останків</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
</head>
<body>
<header class="appbar">
  <!-- Детальна емблема підрозділу криміналістичного забезпечення -->
  <svg class="logo-svg" viewBox="0 0 200 200" width="44" height="44" aria-label="Логотип">
    <!-- Зовнішнє срібне кільце (канат) -->
    <circle cx="100" cy="100" r="96" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
    <circle cx="100" cy="100" r="92" fill="#1f4e79"/>
    
    <!-- Текст по колу: ПІДРОЗДІЛ КРИМІНАЛІСТИЧНОГО ЗАБЕЗПЕЧЕННЯ -->
    <defs>
      <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
      <path id="bottomArc" d="M 35,105 A 65,65 0 0,0 165,105" fill="none"/>
    </defs>
    <text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">ПІДРОЗДІЛ КРИМІНАЛІСТИЧНОГО ЗАБЕЗПЕЧЕННЯ</textPath>
    </text>
    <text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">UNIT OF FORENSIC SUPPORT</textPath>
    </text>
    
    <!-- Внутрішнє біле кільце -->
    <circle cx="100" cy="100" r="62" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
    
    <!-- Центральний щит (синьо-жовтий) -->
    <circle cx="100" cy="100" r="55" fill="#1f4e79" stroke="#ffd700" stroke-width="2"/>
    
    <!-- Хрест-поділ на 4 сектори -->
    <line x1="100" y1="45" x2="100" y2="155" stroke="#c0c0c0" stroke-width="3"/>
    <line x1="45" y1="100" x2="155" y2="100" stroke="#c0c0c0" stroke-width="3"/>
    
    <!-- Сектори -->
    <path d="M 100,45 L 155,100 L 100,100 Z" fill="#ffd700"/>
    <path d="M 100,45 L 45,100 L 100,100 Z" fill="#1f4e79"/>
    <path d="M 45,100 L 100,155 L 100,100 Z" fill="#ffd700"/>
    <path d="M 155,100 L 100,155 L 100,100 Z" fill="#1f4e79"/>
    
    <!-- Центральний тризуб -->
    <g transform="translate(100,100)">
      <path d="M 0,-18 L 0,12 M -10,-12 L -10,8 M 10,-12 L 10,8 M -10,-12 Q -10,-20 0,-22 Q 10,-20 10,-12 M -10,8 Q -10,18 0,20 Q 10,18 10,8" 
            stroke="#ffd700" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Іконки в секторах -->
    <!-- Книга (верхній лівий) -->
    <g transform="translate(75,75)">
      <rect x="-8" y="-6" width="16" height="12" fill="#fff" stroke="#333" stroke-width="0.8"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#333" stroke-width="0.5"/>
      <line x1="-6" y1="-3" x2="-2" y2="-3" stroke="#333" stroke-width="0.4"/>
      <line x1="-6" y1="0" x2="-2" y2="0" stroke="#333" stroke-width="0.4"/>
      <line x1="2" y1="-3" x2="6" y2="-3" stroke="#333" stroke-width="0.4"/>
      <line x1="2" y1="0" x2="6" y2="0" stroke="#333" stroke-width="0.4"/>
    </g>
    
    <!-- Камера (верхній правий) -->
    <g transform="translate(125,75)">
      <rect x="-10" y="-6" width="20" height="14" rx="2" fill="#333" stroke="#888" stroke-width="0.5"/>
      <circle cx="0" cy="1" r="5" fill="#111" stroke="#666" stroke-width="0.8"/>
      <circle cx="0" cy="1" r="2.5" fill="#446"/>
      <rect x="-5" y="-9" width="10" height="4" rx="1" fill="#555"/>
    </g>
    
    <!-- Відбиток пальця (нижній лівий) -->
    <g transform="translate(75,125)">
      <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="#c0c0c0" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="5" ry="7" fill="none" stroke="#c0c0c0" stroke-width="0.8"/>
      <ellipse cx="0" cy="0" rx="2" ry="4" fill="none" stroke="#c0c0c0" stroke-width="0.6"/>
    </g>
    
    <!-- ДНК (нижній правий) -->
    <g transform="translate(125,125)">
      <path d="M -6,-10 Q 6,-5 -6,0 Q 6,5 -6,10" stroke="#c0c0c0" stroke-width="1.2" fill="none"/>
      <path d="M 6,-10 Q -6,-5 6,0 Q -6,5 6,10" stroke="#c0c0c0" stroke-width="1.2" fill="none"/>
      <line x1="-4" y1="-7" x2="4" y2="-7" stroke="#c0c0c0" stroke-width="0.6"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#c0c0c0" stroke-width="0.6"/>
      <line x1="-4" y1="7" x2="4" y2="7" stroke="#c0c0c0" stroke-width="0.6"/>
    </g>
  </svg>
  <h1>Огляд останків</h1>
  <button id="btnNew" class="icon-btn" aria-label="Нова таблиця">🔄</button>
</header>

<main>
  <section>
    <label class="field"><span>№ Тіла (Обов'язково)</span>
      <input type="text" id="bodyNumber" placeholder="Напр. 20260916010004067">
    </label>
    <label class="field"><span>Місце дослідження</span>
      <input type="text" id="place" placeholder="ДСУ «Одеське ОБ СМЕ»...">
    </label>
    <div class="row-2">
      <label class="field"><span>Дата дослідження</span><input type="date" id="date"></label>
      <label class="field"><span>Спеціаліст №1 (ПІБ)</span><input type="text" id="spec1"></label>
    </div>
    <label class="field"><span>Спеціаліст №2 (ПІБ)</span><input type="text" id="spec2"></label>
  </section>

  <section>
    <h2>Фотографії (<span id="count">0</span>)</h2>
    <div class="btn-row">
      <button id="btnCamera" class="btn primary">📷 Камера</button>
      <button id="btnGallery" class="btn outline">️ Галерея</button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galInput" accept="image/*" multiple hidden>
    <div id="photoList"></div>
  </section>
</main>

<div class="bottombar">
  <button id="btnFinish" class="btn primary" disabled>💾 Згенерувати Фототаблицю</button>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="spinner"></div>
  <div id="overlayText" style="margin-top:12px;"></div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<script src="docx.js"></script>
<script src="app.js"></script>
</body>
</html>
